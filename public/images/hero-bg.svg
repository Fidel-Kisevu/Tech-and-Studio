<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Deep Charcoal Background -->
  <rect width="1920" height="1080" fill="#171a19"/>

  <!-- Abstract Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <!-- Vertical Lines -->
    <line x1="120" y1="0" x2="120" y2="1080" />
    <line x1="240" y1="0" x2="240" y2="1080" />
    <line x1="360" y1="0" x2="360" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="600" y1="0" x2="600" y2="1080" />
    <line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="840" y1="0" x2="840" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1080" y1="0" x2="1080" y2="1080" />
    <line x1="1200" y1="0" x2="1200" y2="1080" />
    <line x1="1320" y1="0" x2="1320" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
    <line x1="1560" y1="0" x2="1560" y2="1080" />
    <line x1="1680" y1="0" x2="1680" y2="1080" />
    <line x1="1800" y1="0" x2="1800" y2="1080" />
    
    <!-- Horizontal Lines -->
    <line x1="0" y1="120" x2="1920" y2="120" />
    <line x1="0" y1="240" x2="1920" y2="240" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="480" x2="1920" y2="480" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="840" x2="1920" y2="840" />
    <line x1="0" y1="960" x2="1920" y2="960" />
  </g>

  <!-- Glowing Orbs (Warm Gold and Deep Blue) -->
  <g filter="url(#filter0_f_1_1)">
    <circle cx="1400" cy="300" r="400" fill="#c5a880" fill-opacity="0.15"/>
  </g>
  <g filter="url(#filter1_f_1_1)">
    <circle cx="400" cy="800" r="300" fill="#3b82f6" fill-opacity="0.1"/>
  </g>

  <!-- Abstract Geometric Structural Lines (Represents Systems & Code) -->
  <g opacity="0.2" stroke="url(#paint0_linear_1_1)" stroke-width="2">
    <path d="M 1200 0 L 1200 400 L 1600 800 L 1600 1080" />
    <path d="M 1400 0 L 1400 300 L 1800 700" />
    <path d="M 800 1080 L 800 800 L 1200 400" />
  </g>

  <defs>
    <filter id="filter0_f_1_1" x="800" y="-300" width="1200" height="1200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="150" result="effect1_foregroundBlur_1_1"/>
    </filter>
    <filter id="filter1_f_1_1" x="0" y="400" width="800" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur_1_1"/>
    </filter>
    <linearGradient id="paint0_linear_1_1" x1="1200" y1="0" x2="1400" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5a880" stop-opacity="0"/>
      <stop offset="1" stop-color="#c5a880"/>
    </linearGradient>
  </defs>
</svg>